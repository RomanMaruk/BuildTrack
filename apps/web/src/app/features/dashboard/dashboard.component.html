@let dashboardData = dashboardData$ | async;

<div class="d-flex justify-content-between align-items-center">
  <h2 class="title mb-4">Dashboard</h2>
  <p-datepicker
    [ngModel]="rangeDatesModel()"
    (ngModelChange)="rangeDatesModel.set($event)"
    selectionMode="range"
    [readonlyInput]="true"
    [dateFormat]="'dd-mm-yy'"
    [minDate]="initialDateRange[0]"
    [maxDate]="initialDateRange[1]"
  />
</div>
<section class="dashboard-cards">
  <app-card-amount
    title="Всього витрачено"
    mainAmount="{{ dashboardData?.totalToDay }} грн"
    secondaryAmount="101 300 $"
    icon="pi-dollar"
    variant="blue"
  ></app-card-amount>
  <app-card-amount
    title="За сьогодні"
    mainAmount="{{ dashboardData?.totalToDay }} грн"
    secondaryAmount="28 $"
    icon="pi-gift"
    variant="green"
  ></app-card-amount>
  <app-card-amount
    title="За місяць"
    mainAmount="{{ dashboardData?.amountOfMounth }} грн"
    secondaryAmount="7 680 $"
    icon="pi-percentage"
    variant="purple"
  ></app-card-amount>
  <app-card-amount
    title="Кількість покупок"
    mainAmount="{{ dashboardData?.amountBaying }}"
    secondaryAmount="+{{ dashboardData?.amountBaying }} за місяць"
    icon="pi-shopping-cart"
    variant="orange"
  ></app-card-amount>
</section>

<section class="dashboard-components">
  <div class="dashboard-components-item expense-by-category">
    <app-expense-by-category />
  </div>
  <div class="dashboard-components-item expense-trend">
    <app-expense-trend />
  </div>
  <div class="dashboard-components-item recent-expenses">
    <app-recent-expenses />
  </div>
  <div class="dashboard-components-item quick-actions">
    <app-quick-actions />
  </div>
</section>
