<div class="d-flex justify-content-between align-items-center">
  <h2 class="title mb-4">Dashboard</h2>
  <p-datepicker
    [ngModel]="rangeDatesModel()"
    (ngModelChange)="rangeDatesModel.set($event)"
    selectionMode="range"
    [readonlyInput]="true"
    [dateFormat]="'dd-mm-yy'"
  />
</div>
<div class="dashboard-cards">
  <app-card-amount
    title="Всього витрачено"
    mainAmount="4 231 000 грн"
    secondaryAmount="101 300 $"
    icon="pi-dollar"
    variant="blue"
  ></app-card-amount>
  <app-card-amount
    title="За сьогодні"
    mainAmount="1 200 грн"
    secondaryAmount="28 $"
    icon="pi-gift"
    variant="green"
  ></app-card-amount>
  <app-card-amount
    title="За місяць"
    mainAmount="321 000 грн"
    secondaryAmount="7 680 $"
    icon="pi-percentage"
    variant="purple"
  ></app-card-amount>
  <app-card-amount
    title="Кількість покупок"
    mainAmount="421"
    secondaryAmount="+18 за місяць"
    icon="pi-shopping-cart"
    variant="orange"
  ></app-card-amount>
</div>
