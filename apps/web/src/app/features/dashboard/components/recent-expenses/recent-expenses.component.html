<div class="card">
  <div class="card-header d-flex justify-content-between align-items-center">
    <h5 class="card-title">Recent Expenses</h5>
    <a class="btn text-primary btn-sm" routerLink="/app/expenses">Look All Expenses</a>
  </div>

  <div class="card-body">
    <p-table [value]="products">
                <ng-template #header>
                    <tr>
                        <th>Date</th>
                        <th>Category</th>
                        <th>Sub Category</th>
                        <th>Name</th>
                        <th>Amount</th>
                        <th>Sum</th>
                        <th>Currency</th>
                    </tr>
                </ng-template>
                <ng-template #body let-product>
                    <tr>
                        <td>{{ product.date }}</td>
                        <td>{{ product.category }}</td>
                        <td>{{ product.subCategory }}</td>
                        <td>{{ product.name }}</td>
                        <td>{{ product.amount }}</td>
                        <td>{{ product.sum }}</td>
                        <td>{{ product.currency }}</td>
                    </tr>
                </ng-template>
    </p-table>
  </div>
</div>
