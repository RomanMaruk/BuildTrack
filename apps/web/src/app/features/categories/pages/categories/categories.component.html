<div class="header d-flex justify-content-between align-items-center mb-3">
  <h3>Categories</h3>
  <button class="btn btn-primary" (click)="addCategory()">
    <span class="btn-icon me-2 fs-5" aria-hidden="true">+</span>
    <span>Add Category</span>
  </button>
</div>


<div class="card">
  <div class="d-flex flex-wrap gap-2 p-2">
    <p-button icon="pi pi-plus" label="Expand all" (click)="expandAll()" />
    <p-button icon="pi pi-minus" label="Collapse all" (click)="collapseAll()" />
  </div>
  <input type="text" class="form-control" placeholder="Search categories..." />
  <p-tree [value]="categoriesTree()" class="w-full md:w-[30rem]" />
</div>
